<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080711">
<title>Q Multifunctional</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#080711;
    --bg2:#100b20;
    --card:rgba(24,20,45,.72);
    --card2:rgba(38,30,73,.72);
    --text:#f5f3ff;
    --muted:#8580a2;
    --primary:#6955ff;
    --secondary:#b55cff;
    --cyan:#45dfff;
    --border:rgba(255,255,255,.12);
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 15%,rgba(101,70,255,.16),transparent 30%),
        radial-gradient(circle at 85% 40%,rgba(0,190,255,.10),transparent 28%),
        linear-gradient(180deg,#080711,#0b0718 45%,#06060d);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;
    overflow-x:hidden;
}

/* =========================
   PARTICLE BACKGROUND
========================= */

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-5;
    pointer-events:none;
}

.noise{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

/* =========================
   SPLASH
========================= */

#splash{
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,rgba(78,50,190,.18),transparent 35%),
        #05050a;
    overflow:hidden;
    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#splash.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.splash-core{
    position:relative;
    width:180px;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.splash-q{
    width:120px;
    height:120px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:74px;
    font-weight:800;
    color:white;
    background:
        linear-gradient(135deg,#1bbcff,#705bff 48%,#c25cff);
    box-shadow:
        0 0 30px rgba(80,130,255,.7),
        0 0 100px rgba(110,65,255,.45);
    opacity:0;
    transform:scale(.15);
    transition:
        opacity .9s ease,
        transform 1.2s cubic-bezier(.2,.9,.2,1);
}

.splash-q.show{
    opacity:1;
    transform:scale(1);
}

.splash-ring{
    position:absolute;
    width:155px;
    height:155px;
    border-radius:50%;
    border:1px solid rgba(100,220,255,.5);
    box-shadow:0 0 40px rgba(90,130,255,.25);
    animation:ringRotate 5s linear infinite;
}

.splash-ring::before,
.splash-ring::after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#69eaff;
    box-shadow:0 0 15px #69eaff;
}

.splash-ring::before{
    top:4px;
    left:50%;
}

.splash-ring::after{
    bottom:18px;
    right:5px;
}

#splashStars{
    position:absolute;
    inset:0;
}

.splash-star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 10px rgba(255,255,255,.9);
    transition:
        left 1.4s cubic-bezier(.15,.9,.2,1),
        top 1.4s cubic-bezier(.15,.9,.2,1),
        transform 1.4s ease,
        opacity 1.2s ease;
}

.splash-text{
    position:absolute;
    bottom:70px;
    text-align:center;
    opacity:0;
    transform:translateY(15px);
    transition:all .8s ease;
}

.splash-text.show{
    opacity:1;
    transform:translateY(0);
}

.splash-text strong{
    display:block;
    font-size:20px;
    letter-spacing:5px;
}

.splash-text span{
    display:block;
    margin-top:8px;
    color:#77728e;
    font-size:11px;
    letter-spacing:3px;
}

/* =========================
   TOP HEADER
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:74px;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:linear-gradient(
        180deg,
        rgba(5,5,10,.78),
        rgba(5,5,10,.08)
    );
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    pointer-events:none;
}

.top-brand{
    display:flex;
    align-items:center;
    gap:10px;
    opacity:0;
    transform:translateX(-25px) scale(.92);
    transition:
        opacity .45s ease,
        transform .55s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
}

.top-brand.visible{
    opacity:1;
    transform:translateX(0) scale(1);
}

.top-brand-q{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:22px;
    background:linear-gradient(135deg,#23caff,#7656ff,#c35bff);
    box-shadow:0 0 25px rgba(89,90,255,.45);
}

.top-brand-name{
    font-size:14px;
    font-weight:650;
    letter-spacing:.5px;
}

.top-brand-name span{
    color:#8f88aa;
    font-weight:400;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:auto;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--border);
    background:rgba(30,27,47,.65);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:17px;
    transition:all .25s ease;
    backdrop-filter:blur(12px);
}

.icon-btn:active{
    transform:scale(.88);
}

/* =========================
   MAIN
========================= */

main{
    width:min(100%,720px);
    margin:auto;
    padding:70px 18px 50px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:400px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    padding-top:30px;
}

.hero-logo-wrap{
    position:relative;
    width:190px;
    height:190px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:28px;
    transition:
        transform .1s linear,
        opacity .1s linear;
    will-change:transform;
}

.hero-logo{
    width:150px;
    height:150px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    font-size:92px;
    font-weight:800;
    color:#e9faff;
    background:
        radial-gradient(circle at 35% 25%,#42d9ff,#635fff 52%,#a951ff);
    box-shadow:
        0 0 35px rgba(59,195,255,.35),
        0 0 90px rgba(112,65,255,.25),
        inset 0 0 30px rgba(255,255,255,.12);
}

.hero-logo::before{
    content:"";
    position:absolute;
    inset:-11px;
    border-radius:50%;
    border:1px solid rgba(75,220,255,.6);
    border-right-color:transparent;
    transform:rotate(-25deg);
}

.hero-logo::after{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    border-radius:50%;
    right:-2px;
    top:48px;
    background:#9ef8ff;
    box-shadow:0 0 18px #9ef8ff;
}

.hero-logo-sub{
    position:absolute;
    bottom:4px;
    font-size:12px;
    letter-spacing:6px;
    color:#e58cff;
    text-indent:6px;
}

.hero-title{
    font-size:35px;
    line-height:1.1;
    font-weight:750;
    letter-spacing:-1.5px;
    background:linear-gradient(90deg,#fff,#b7f3ff,#b68aff);
    -webkit-background-clip:text;
    color:transparent;
}

.hero-subtitle{
    margin-top:12px;
    color:#817c9b;
    font-size:15px;
    transition:opacity .3s ease;
}

/* =========================
   LANGUAGE
========================= */

.language-area{
    position:relative;
    margin:15px auto 30px;
    width:100%;
    max-width:380px;
    display:flex;
    justify-content:center;
}

.language-select{
    appearance:none;
    -webkit-appearance:none;
    width:190px;
    padding:13px 42px 13px 18px;
    border-radius:30px;
    border:1px solid rgba(119,94,255,.5);
    background:
        linear-gradient(
            135deg,
            rgba(76,54,174,.65),
            rgba(35,28,78,.75)
        );
    color:white;
    font-size:14px;
    outline:none;
    cursor:pointer;
    box-shadow:0 10px 35px rgba(70,50,180,.2);
}

.language-area::after{
    content:"⌄";
    position:absolute;
    right:calc(50% - 77px);
    top:11px;
    font-size:19px;
    color:#c9c2ff;
    pointer-events:none;
}

/* =========================
   SECTIONS
========================= */

.section{
    margin-top:34px;
    scroll-margin-top:90px;
}

.section-label{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 6px 13px;
    color:#8580a1;
    font-size:12px;
    font-weight:650;
    letter-spacing:3px;
    text-transform:uppercase;
}

.section-label::before{
    content:"";
    width:4px;
    height:14px;
    border-radius:5px;
    background:linear-gradient(#48ddff,#7957ff);
    box-shadow:0 0 10px rgba(82,135,255,.5);
}

/* =========================
   SEARCH
========================= */

.search-box{
    position:relative;
}

.search-input{
    width:100%;
    height:62px;
    padding:0 60px 0 22px;
    border-radius:32px;
    border:1px solid rgba(255,255,255,.13);
    outline:none;
    background:rgba(20,18,34,.76);
    color:white;
    font-size:17px;
    transition:all .3s ease;
    box-shadow:var(--shadow);
}

.search-input:focus{
    border-color:rgba(106,91,255,.75);
    box-shadow:
        0 0 0 4px rgba(104,83,255,.09),
        0 20px 60px rgba(0,0,0,.35);
}

.search-icon{
    position:absolute;
    right:17px;
    top:10px;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    background:rgba(75,67,111,.35);
}

/* Search results */

.search-results{
    margin-top:12px;
    display:grid;
    gap:8px;
}

.search-result{
    padding:16px;
    border-radius:18px;
    border:1px solid var(--border);
    background:rgba(22,19,39,.85);
    cursor:pointer;
    animation:slideUp .3s ease;
    transition:transform .2s ease,background .2s ease;
}

.search-result:active{
    transform:scale(.98);
}

.search-result-title{
    font-size:15px;
    font-weight:650;
}

.search-result-desc{
    margin-top:5px;
    color:#817c99;
    font-size:12px;
}

/* =========================
   ADS
========================= */

.ad-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.ad-card{
    position:relative;
    min-height:105px;
    padding:20px;
    border-radius:22px;
    overflow:hidden;
    border:1px solid rgba(116,91,255,.38);
    background:
        linear-gradient(
            135deg,
            rgba(57,42,125,.75),
            rgba(25,22,58,.78)
        );
    cursor:pointer;
    transition:
        transform .25s ease,
        border-color .25s ease;
}

.ad-card::after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    right:-35px;
    bottom:-35px;
    border-radius:50%;
    background:rgba(76,220,255,.15);
    filter:blur(15px);
}

.ad-card:active{
    transform:scale(.96);
}

.ad-card:hover{
    transform:translateY(-3px);
    border-color:rgba(111,100,255,.75);
}

.ad-tag{
    font-size:9px;
    color:#aaa3d0;
    letter-spacing:2px;
    margin-bottom:12px;
}

.ad-title{
    font-size:22px;
    font-weight:700;
}

.ad-description{
    margin-top:6px;
    color:#938cab;
    font-size:11px;
}

/* =========================
   MENU
========================= */

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.menu-card{
    min-height:115px;
    border-radius:22px;
    padding:18px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(
            145deg,
            rgba(34,29,62,.88),
            rgba(18,17,31,.88)
        );
    border:1px solid rgba(255,255,255,.09);
    cursor:pointer;
    transition:
        transform .3s cubic-bezier(.2,.8,.2,1),
        border-color .3s ease,
        box-shadow .3s ease;
}

.menu-card:hover{
    transform:translateY(-4px);
    border-color:rgba(107,91,255,.55);
    box-shadow:0 18px 45px rgba(0,0,0,.25);
}

.menu-card:active{
    transform:scale(.96);
}

.menu-icon{
    width:42px;
    height:42px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#5f51d9,#28214e);
    font-size:20px;
    margin-bottom:14px;
}

.menu-name{
    font-size:15px;
    font-weight:650;
}

.menu-description{
    margin-top:5px;
    color:#77718e;
    font-size:11px;
    line-height:1.4;
}

.menu-arrow{
    position:absolute;
    right:15px;
    top:17px;
    color:#706a88;
}

/* =========================
   SUBMENU MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:3000;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding:15px;
    background:rgba(0,0,0,.58);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    opacity:0;
    visibility:hidden;
    transition:all .3s ease;
}

.modal.active{
    opacity:1;
    visibility:visible;
}

.modal-panel{
    width:min(100%,620px);
    max-height:82vh;
    overflow:auto;
    border-radius:28px 28px 20px 20px;
    padding:22px;
    background:
        linear-gradient(
            180deg,
            rgba(28,24,50,.98),
            rgba(12,11,21,.98)
        );
    border:1px solid rgba(255,255,255,.1);
    transform:translateY(40px);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
}

.modal.active .modal-panel{
    transform:translateY(0);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-title{
    font-size:20px;
    font-weight:700;
}

.close-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:rgba(255,255,255,.05);
    color:white;
    font-size:20px;
}

.submenu-list{
    display:grid;
    gap:9px;
}

.submenu-item{
    padding:16px;
    border-radius:17px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
    cursor:pointer;
    transition:all .2s ease;
}

.submenu-item:active{
    transform:scale(.98);
    background:rgba(98,81,255,.15);
}

/* =========================
   MARKET
========================= */

.market-list{
    display:grid;
    gap:10px;
}

.market-card{
    display:flex;
    align-items:center;
    gap:13px;
    padding:15px;
    border-radius:19px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(21,19,36,.78);
    transition:transform .2s ease;
}

.market-card:active{
    transform:scale(.985);
}

.coin-icon{
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:750;
    background:linear-gradient(135deg,#4337a5,#17152a);
}

.coin-info{
    flex:1;
    min-width:0;
}

.coin-name{
    font-size:14px;
    font-weight:650;
}

.coin-symbol{
    margin-top:4px;
    color:#77718b;
    font-size:10px;
    text-transform:uppercase;
}

.coin-price{
    text-align:right;
}

.price{
    font-size:14px;
    font-weight:650;
}

.change{
    margin-top:4px;
    font-size:11px;
}

.up{
    color:#4de0a4;
}

.down{
    color:#ff6687;
}

/* =========================
   INFO
========================= */

.info-card{
    padding:22px;
    border-radius:24px;
    background:
        linear-gradient(
            145deg,
            rgba(34,29,61,.72),
            rgba(18,16,30,.82)
        );
    border:1px solid var(--border);
    color:#8d87a5;
    line-height:1.8;
    font-size:13px;
}

.info-card strong{
    color:#f4f1ff;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:45px 15px 25px;
    color:#625d76;
    font-size:11px;
}

.footer-social{
    margin-top:17px;
    display:flex;
    justify-content:center;
    gap:12px;
}

.social{
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:#d8d4e8;
    text-decoration:none;
    transition:all .25s ease;
}

.social:hover{
    transform:translateY(-3px);
    border-color:rgba(100,90,255,.6);
    box-shadow:0 8px 25px rgba(80,70,200,.2);
}

.social svg{
    width:17px;
    height:17px;
    fill:currentColor;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:28px;
    z-index:8000;
    padding:12px 18px;
    border-radius:30px;
    background:rgba(25,22,39,.95);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    font-size:13px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    transition:all .3s ease;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   ANIMATIONS
========================= */

@keyframes ringRotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{
    0%,100%{
        box-shadow:
            0 0 30px rgba(59,195,255,.3),
            0 0 80px rgba(112,65,255,.2);
    }
    50%{
        box-shadow:
            0 0 45px rgba(59,195,255,.5),
            0 0 110px rgba(112,65,255,.35);
    }
}

.hero-logo{
    animation:pulse 4s ease-in-out infinite;
}

/* =========================
   LIGHT THEME
========================= */

body.light{
    --bg:#f4f5fa;
    --bg2:#ffffff;
    --text:#171523;
    --muted:#716d82;
    --border:rgba(30,25,60,.1);

    background:
        radial-gradient(circle at 20% 10%,rgba(102,78,255,.12),transparent 30%),
        linear-gradient(180deg,#f7f7fc,#eef0f8);
}

body.light .topbar{
    background:linear-gradient(
        180deg,
        rgba(245,246,251,.9),
        rgba(245,246,251,.1)
    );
}

body.light .search-input,
body.light .market-card,
body.light .menu-card,
body.light .info-card{
    background:rgba(255,255,255,.75);
    color:#171523;
}

body.light .search-input::placeholder{
    color:#8d899b;
}

body.light .icon-btn{
    color:#222;
    background:rgba(255,255,255,.7);
}

body.light .modal-panel{
    background:#f7f7fc;
}

body.light .submenu-item{
    background:rgba(30,25,60,.04);
}

body.light .section-label,
body.light .hero-subtitle{
    color:#777286;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    main{
        padding-left:15px;
        padding-right:15px;
    }

    .hero{
        min-height:385px;
    }

    .hero-logo{
        width:135px;
        height:135px;
        font-size:82px;
    }

    .hero-logo-wrap{
        width:175px;
        height:175px;
    }

    .hero-title{
        font-size:31px;
    }

/* =========================================================
   JSON LOADER
========================================================= */

async function loadJSON(url, fallback = []){

    try{

        const response = await fetch(
            url + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const json = await response.json();

        return json;

    }catch(error){

        console.warn(
            "Unable to load:",
            url,
            error
        );

        return fallback;

    }

}


/* =========================================================
   NORMALIZE JSON
   Allows several useful JSON structures.
========================================================= */

function normalizeArray(data){

    if(Array.isArray(data)){
        return data;
    }

    if(data && Array.isArray(data.items)){
        return data.items;
    }

    if(data && Array.isArray(data.data)){
        return data.data;
    }

    if(data && typeof data === "object"){

        return Object.entries(data).map(
            ([key,value])=>{

                if(
                    typeof value === "object" &&
                    value !== null
                ){

                    return {
                        id:key,
                        ...value
                    };

                }

                return {
                    id:key,
                    title:value
                };

            }
        );

    }

    return [];

}


/* =========================================================
   INITIAL LOAD
========================================================= */

async function loadAllData(){

    const [

        searchJSON,
        adsJSON,
        menuJSON,
        languageJSON,
        marketJSON

    ] = await Promise.all([

        loadJSON(
            "Search.json",
            []
        ),

        loadJSON(
            "adv.json",
            []
        ),

        loadJSON(
            "index.json",
            []
        ),

        loadJSON(
            "language.json",
            DEFAULT_LANGUAGES
        ),

        loadJSON(
            "market.json",
            []
        )

    ]);


    DATA.search =
        normalizeArray(searchJSON);

    DATA.ads =
        normalizeArray(adsJSON);

    DATA.menu =
        normalizeArray(menuJSON);

    DATA.languages =
        normalizeArray(languageJSON);

    DATA.market =
        normalizeArray(marketJSON);


    if(!DATA.languages.length){

        DATA.languages =
            DEFAULT_LANGUAGES;

    }


    renderLanguages();
    renderAds();
    renderMenu();
    renderMarket();

    applyLanguage(
        DATA.currentLanguage
    );

}

   LANGUAGE
========================================================= */

    DATA.languages.forEach(
        lang=>{

            const option =
                document.createElement("option");

            option.value =
                lang.code ||
                lang.id ||
                lang.key ||
                "en";

            option.textContent =
                lang.name ||
                lang.title ||
                option.value;

            select.appendChild(option);

        }
    );


    select.value =
        DATA.currentLanguage;


    select.addEventListener(
        "change",
        event=>{

            DATA.currentLanguage =
                event.target.value;

            localStorage.setItem(
                "q_language",
                DATA.currentLanguage
            );

            applyLanguage(
                DATA.currentLanguage
            );

        }
    );

}


/* =========================================================
   GET TRANSLATION
========================================================= */

function getText(key){

    const lang =
        FALLBACK_TEXT[
            DATA.currentLanguage
        ] ||
        FALLBACK_TEXT.en;

    return lang[key] ||
        FALLBACK_TEXT.en[key] ||
        key;

}


/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLanguage(code){

    DATA.currentLanguage =
        code || "en";


    document.documentElement.lang =

        "#heroTitle"

        getText("search"),
        getText("advertisement"),
        getText("menu"),
        getText("market"),
        getText("about")

    ];


    labels.forEach(
        (label,index)=>{

/* =========================================================
   MENU INTERACTION
========================================================= */

function handleMenuClick(item){

    const children =
        item.children ||
        item.submenu ||
        item.items ||
        item.menu;


    if(Array.isArray(children) && children.length){

        openSubmenu(
            item,
            children
        );

        return;

    }


    const url =
        item.url ||
        item.link ||
        item.href;


    if(url){

        openLink(url);

        return;

    }


    showToast(
        item.title ||
        item.name ||
        "Menu"
    );

}


/* =========================================================
   SUBMENU
========================================================= */

function openSubmenu(parent,children){

    const modal =
        document.getElementById(
            "menuModal"

    const title =

        parent.name ||
        "Menu";


    document.getElementById(

                    ">
                        ${escapeHTML(
                            child.description ||

            list.appendChild(item);

        }

        "active"
    );

}

/* =========================================================
   MARKET
========================================================= */

function renderMarket(){

    const container =
        document.getElementById(
            "marketList"
        );

    container.innerHTML = "";


    DATA.market.forEach(
        coin=>{

            const card =
                document.createElement("div");

            card.className =
                "market-card";


            const symbol =
                coin.symbol ||
                coin.ticker ||
                "COIN";


            const name =
                coin.name ||
                coin.title ||
                symbol;


            const price =
                coin.price ??
                coin.current_price ??
                coin.value ??
                "--";


            const change =
                coin.change ??
                coin.price_change_percentage_24h ??
                coin.percent ??
                null;


            let changeText =
                "--";


            let changeClass =
                "";


            if(change !== null){

                const number =
                    Number(change);


                if(!Number.isNaN(number)){

                    changeText =
                        (number >= 0 ? "+" : "") +
                        number.toFixed(2) +
                        "%";


                    changeClass =
                        number >= 0
                        ? "up"
                        : "down";

                }

            }


            card.innerHTML = `

                <div class="coin-icon">
                    ${escapeHTML(
                        String(symbol)
                        .substring(0,3)
                        .toUpperCase()
                    )}
                </div>

                <div class="coin-info">

                    <div class="coin-name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="coin-symbol">
                        ${escapeHTML(symbol)}
                    </div>

                </div>

                <div class="coin-price">

                    <div class="price">
                        ${formatPrice(price)}
                    </div>

                    <div class="change ${changeClass}">
                        ${changeText}
                    </div>

                </div>

            `;


            container.appendChild(card);

        }
    );


    if(!DATA.market.length){

        container.innerHTML = `

            <div class="market-card">

                <div class="coin-icon">
                    Q
                </div>

                <div class="coin-info">

                    <div class="coin-name">
                        Market

                        Waiting for market.json

                    <div class="price">--</div>
                </div>

            </div>

        `;

    }

}


/* =========================================================
   SEARCH
========================================================= */

    document.getElementById(
        "searchInput"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


let searchTimer;


searchInput.addEventListener(
    "input",
    event=>{

        clearTimeout(
            searchTimer
        );


        searchTimer =
            setTimeout(
                ()=>{

                    performSearch(
                        event.target.value
                    );

                },
                120
            );

    }
);


function performSearch(query){

    query =
        query.trim().toLowerCase();


    searchResults.innerHTML = "";


    if(!query){
        return;
    }


    const results =
        DATA.search.filter(
            item=>{

                const content =
                    JSON.stringify(
                        item
                    ).toLowerCase();

                return content.includes(
                    query
                );

            }
        ).slice(0,20);


    results.forEach(
        item=>{

            const result =
                document.createElement("div");

            result.className =
                "search-result";


            const title =
                item.title ||
                item.name ||
                item.keyword ||
                "Result";


            const description =
                item.description ||
                item.desc ||
                "";


            result.innerHTML = `

                <div class="search-result-title">
                    ${escapeHTML(title)}
                </div>

                ${
                    description
                    ?
                    `<div class="search-result-desc">
                        ${escapeHTML(description)}
                    </div>`
                    :
                    ""
                }

            `;


            result.addEventListener(
                "click",
                ()=>{

                    openLink(
                        item.url ||
                        item.link ||
                        item.href
                    );

                }
            );


            searchResults.appendChild(
                result
            );

        }
    );


    if(!results.length){

        searchResults.innerHTML = `

            <div class="search-result">

                <div class="search-result-title">
                    No results
                </div>

                <div class="search-result-desc">
                    Nothing found for "${escapeHTML(query)}"
                </div>

            </div>

        `;

    }

}


/* =========================================================
   SCROLL INTERACTION
========================================================= */

const heroLogo =
    document.getElementById(
        "heroLogo"
    );


const topBrand =
    document.getElementById(
        "topBrand"
    );


const heroTitle =
    document.getElementById(
        "heroTitle"
    );


let ticking = false;


function updateScroll(){

    const scrollY =
        window.scrollY || 0;


    /*
        IMPORTANT:

        Q Multifunctional at the top is
        the hero title.

        The small top-bar version:

        Q - Multifunctional

        is hidden initially.

        It appears only after the
        user starts scrolling.
    */


    const threshold = 55;


    if(scrollY > threshold){

        topBrand.classList.add(
            "visible"
        );

    }else{

        topBrand.classList.remove(
            "visible"
        );

    }


    /*
        Logo moves toward upper-left
        while scrolling.
    */

    const move =
        Math.min(
            scrollY,
            180
        );


    const x =
        Math.min(
            move * .34,
            60
        );


    const y =
        Math.min(
            move * .58,
            115
        );


    const scale =
        Math.max(
            .62,
            1 - move / 700
        );


    heroLogo.style.transform =
        `translate(${-x}px,${-y}px) scale(${scale})`;


    const titleOpacity =
        Math.max(
            0,
            1 - scrollY / 180
        );


    heroTitle.style.opacity =
        titleOpacity;


    ticking = false;

}


window.addEventListener(
    "scroll",
    ()=>{

        if(!ticking){

            window.requestAnimationFrame(
                updateScroll
            );

            ticking = true;

        }

    },
    {
        passive:true
    }
);

/* =========================================================
   SPLASH PARTICLES
========================================================= */

function createSplash(){

    const container =
        document.getElementById(
            "splashStars"
        );


    const count =
        window.innerWidth < 500
        ? 130
        : 220;


    const stars = [];


    for(let i=0;i<count;i++){

        const star =
            document.createElement("span");


        star.className =
            "splash-star";


        const x =
            Math.random() *
            window.innerWidth;


        const y =
            Math.random() *
            window.innerHeight;


        star.style.left =
            x + "px";


        star.style.top =
            y + "px";


        star.style.opacity =
            Math.random() * .9 + .1;


        const size =
            Math.random() * 3 + 1;


        star.style.width =
            size + "px";


        star.style.height =
            size + "px";


        container.appendChild(
            star
        );


        stars.push(star);

    }


    setTimeout(
        ()=>{

            stars.forEach(
                star=>{

                    const centerX =
                        window.innerWidth / 2;


                    const centerY =
                        window.innerHeight / 2;


                    /*
                        Slightly irregular
                        orbital movement before
                        converging.
                    */

                    const angle =
                        Math.random() *
                        Math.PI * 2;


                    const radius =
                        45 +
                        Math.random() * 70;


                    star.style.left =
                        (
                            centerX +
                            Math.cos(angle) *
                            radius
                        ) + "px";


                    star.style.top =
                        (
                            centerY +
                            Math.sin(angle) *
                            radius
                        ) + "px";


                    star.style.transform =
                        "scale(1.7)";

                }
            );

        },
        250
    );


    setTimeout(
        ()=>{

            document.getElementById(
                "splashQ"
            ).classList.add(
                "show"
            );

        },
        1250
    );


    setTimeout(
        ()=>{

            document.getElementById(
                "splashText"
            ).classList.add(
                "show"
            );

        },
        1700
    );


    setTimeout(
        ()=>{

            document.getElementById(
                "splash"
            ).classList.add(
                "hide"
            );

        },
        2500
    );

}


createSplash();


/* =========================================================
   OPEN LINKS
========================================================= */

function openLink(url){

    if(!url){

        showToast(
            "No link configured"
        );

        return;

    }


    if(
        typeof url === "string" &&
        url.trim()
    ){

        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "--";

    }


    if(
        typeof value === "number"
    ){

        return value >= 1
            ? value.toLocaleString(
                undefined,
                {
                    maximumFractionDigits:2
                }
            )
            : value.toFixed(6);

    }


    return String(value);

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   BACKGROUND PARTICLE SYSTEM
========================================================= */

const canvas =
    document.getElementById(
        "particles"
    );


const ctx =
    canvas.getContext("2d");


let particles = [];
let width = 0;
let height = 0;


function resizeCanvas(){

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        window.innerWidth;


    height =
        window.innerHeight;


    canvas.width =
        width * ratio;


    canvas.height =
        height * ratio;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    createParticles();

}


function createParticles(){

    particles = [];


    const count =
        Math.min(
            85,
            Math.max(
                35,
                Math.floor(
                    width * height / 13000
                )
            )
        );


    for(let i=0;i<count;i++){

        particles.push({

            x:
                Math.random() * width,

            y:
                Math.random() * height,

            vx:
                (Math.random() - .5) * .18,

            vy:
                (Math.random() - .5) * .18,

            size:
                Math.random() * 1.6 + .4,

            alpha:
                Math.random() * .55 + .15,

            phase:
                Math.random() * Math.PI * 2

        });

    }

}


function animateParticles(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const time =
        Date.now() * .001;


    particles.forEach(
        particle=>{

            particle.x +=
                particle.vx;


            particle.y +=
                particle.vy;


            particle.phase +=
                .008;


            if(particle.x < -10)
                particle.x = width + 10;


            if(particle.x > width + 10)
                particle.x = -10;


            if(particle.y < -10)
                particle.y = height + 10;


            if(particle.y > height + 10)
                particle.y = -10;


            const alpha =
                particle.alpha +
                Math.sin(
                    time +
                    particle.phase
                ) * .12;


            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `rgba(120,180,255,${Math.max(
                    .05,
                    alpha
                )})`;

            ctx.fill();

        }
    );


    /*
        Draw subtle connections
        between nearby particles.
    */

    for(
        let i=0;
        i<particles.length;
        i++
    ){

        for(
            let j=i+1;
            j<particles.length;
            j++
        ){

            const a =
                particles[i];

            const b =
                particles[j];


            const dx =
                a.x - b.x;


            const dy =
                a.y - b.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if(distance < 110){

                const opacity =
                    (1 - distance / 110)
                    * .08;


                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.strokeStyle =
                    `rgba(112,106,255,${opacity})`;

                ctx.lineWidth =
                    .6;

                ctx.stroke();

            }

        }

    }


    requestAnimationFrame(
        animateParticles
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();
animateParticles();
